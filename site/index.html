<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reach</title>
<meta name="description" content="Reach proves what cloud credentials, and the AI agents holding them, can reach in AWS.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23000'/%3E%3Cpath d='M10 7v18M10 16h13' stroke='%23fff' stroke-width='3.2' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root { --paper: #000; --ink: #ededed; --muted: #777; color-scheme: dark; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.6 ui-monospace, "SF Mono", Consolas, monospace; }
main { max-width: 560px; margin: 0 auto; padding: 20vh 20px 40px; }
p { margin: 0 0 24px; }
.muted, a { color: var(--muted); }
a { text-underline-offset: 3px; margin-right: 16px; }
a:hover { color: var(--ink); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <p>reach</p>
  <p class="muted">Prove what a cloud credential can reach in AWS.</p>
  <p><button type="button" id="cmd" title="Copy">pip install reach-security</button></p>
  <p>
    <a href="https://github.com/stillnotadam/Reach">github</a><a href="demo/report.html">demo</a><a href="https://pypi.org/project/reach-security/">pypi</a>
  </p>
</main>
<script>
document.getElementById("cmd").addEventListener("click", (e) => {
  navigator.clipboard.writeText(e.currentTarget.textContent).catch(() => getSelection().selectAllChildren(e.currentTarget));
});
</script>
</body>
</html>
