name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests validation scripts
      - run: ruff format --check src tests validation scripts
      - run: mypy src/reach --ignore-missing-imports
      - name: pytest
        shell: bash
        run: |
          set -o pipefail
          pytest -q -rfE 2>&1 | tee pytest.log
      - name: Annotate failing tests
        if: failure()
        shell: bash
        run: |
          grep -E '^(FAILED|ERROR) ' pytest.log | head -20 | while read -r line; do
            echo "::error title=pytest::${line:0:400}"
          done

  fuzz:
    # A longer differential-fuzzing slice than the test suite runs: engine vs reference evaluator.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e .
      - run: python -m validation.fuzz --cases 400 --seed ${{ github.run_number }}
