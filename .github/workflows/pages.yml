name: Pages

# Builds the project website (site/) with a live demo report generated by the current engine, and publishes it to
# GitHub Pages. Needs Settings > Pages > Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ["site/**", "scripts/build_site.py", "scripts/synth_account.py", "src/reach/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e .
      - run: python scripts/build_site.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
